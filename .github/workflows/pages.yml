name: Deploy web app

on:
  push:
    branches: ['claude/**', main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether Pages is switched on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Turning Pages on for the first time needs repository-admin rights,
          # which the workflow token does not have. Rather than failing every
          # push until someone notices, the job explains the one-time step and
          # stops here.
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Web app not deployed"
              echo
              echo "GitHub Pages is not switched on for this repository yet, and a"
              echo "workflow cannot switch it on for you."
              echo
              echo "**One-time setup:** Settings → Pages → Build and deployment →"
              echo "Source → **GitHub Actions**. Re-run this workflow afterwards and"
              echo "every push will deploy from then on."
              echo
              echo "The Android APK is unaffected — it is published from the"
              echo "\`Build Android APK\` workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.pages.outputs.enabled == 'true'
        run: npm ci

      - if: steps.pages.outputs.enabled == 'true'
        run: npx vite build

      - name: Serve index.html for unknown paths
        if: steps.pages.outputs.enabled == 'true'
        # GitHub Pages has no rewrite rules, so a copy of the shell under
        # 404.html keeps deep links and refreshes working.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
